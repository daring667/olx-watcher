# Ссылку выдачи откройте на OLX вручную: выберите Алматы, «Видеокарты»,
# сортировку «Сначала новые», затем скопируйте адрес из браузера сюда.
# search[dist]=30 — Алматы плюс область в радиусе 30 км. Радиус сохраняется
# при переходе по страницам, отдельная ссылка на пригород не нужна.
search_urls:
  - "https://www.olx.kz/d/elektronika/kompyutery-i-komplektuyuschie/komplektuyuschie-i-aksesuary/videokarty/alma-ata/?search%5Bdist%5D=30"

# Полный обход категории требует паузы между циклами, чтобы не перегружать OLX.
poll_interval_seconds: 3600
# 0 = идти до первой пустой страницы. Для ограничения обхода укажите число страниц.
max_pages_per_search: 0
# Небольшая пауза между страницами выдачи.
page_delay_seconds: 1.5
daily_summary_time: "21:00"
# Единственный потолок цены — для всех карт, независимо от модели.
max_price_kzt: 50000

# Сколько обходов подряд объявление должно отсутствовать в выдаче, чтобы
# считаться снятым. При обходе раз в час три цикла — это три часа: разовый
# сбой сети или пропуск страницы отметку не вызовет.
missing_cycles_before_gone: 3

# Ищем ВЕНДОРА, а не модель: любая карта NVIDIA, решает цена.
# Серия GT (GT 710, GT 1030 и подобные) сознательно не включена — слишком старая.
# Поиск идёт по заголовку и полному тексту объявления, без учёта регистра.
required_any_keywords:
  - "nvidia"
  - "geforce"
  - "rtx"
  - "gtx"
  - "titan"

# Карты других вендоров. Проверяется ТОЛЬКО заголовок: в описании NVIDIA-карты
# постоянно сравнивают с Radeon, и по описанию сюда попадала 21 чужая карта.
# Если в заголовке есть и слово из required_any_keywords — это сборный лот
# вроде «GTX 660Ti / R9 270X», такое остаётся.
foreign_vendor_keywords:
  - "radeon"
  - "rx"
  - "amd"
  - "vega"
  - "arc a"
  - "arc b"
  - "r9 "
  - "r7 "
  - "firepro"

# Голый номер модели в заголовке: «Видеокарта Palit 1660 ti» не содержит ни
# nvidia, ни geforce, и без этого списка терялись 34 обычные карты.
# Проверяется ТОЛЬКО заголовок: в описании «1080» встречается почти всегда
# в виде «тянет 1080p». Номера серии GT сюда намеренно не входят.
model_number_keywords:
  - "1050"
  - "1060"
  - "1070"
  - "1080"
  - "1630"
  - "1650"
  - "1660"
  - "2060"
  - "2070"
  - "2080"
  - "3050"
  - "3060"
  - "3070"
  - "3080"
  - "3090"
  - "4060"
  - "4070"
  - "4080"
  - "4090"
  - "5060"
  - "5070"
  - "5080"
  - "5090"

# Серии GT/GTS любого номера и GTX ниже 900 отсекаются ПРАВИЛОМ в коде
# (is_outdated_series), а не перечислением: раньше здесь лежало больше сотни
# строк, и всё равно «9400 GT» просочилась мимо списка. GTX 9xx (950/960/970/980)
# правило оставляет — вы просили их сохранить.
#
# Здесь остаются только те древние карты, которые правилом не выражаются:
# у них номер стоит перед названием серии, а серия — не GT.
outdated_keywords:
  - "8800"
  - "9800 gtx"
  - "9600 gso"
  - "9600gso"
  - "7300 gs"
  - "8400 gs"
  - "gf6200"
  - "gf 6200"
  - "gf210"
  - "g210"
  - "g 210"
  - "geforce210"
  - "geforce 210"

# Майнинговые карты без видеовыходов. Из выборки НЕ исключаются: формально
# это NVIDIA и цена бывает заманчивой. Помечаются флагом — в панели для них
# отдельный экран, в уведомлении строка «⛏ Майнинговая карта».
# Проверяется только заголовок: в описании игровой карты «аналог P106» —
# это сравнение, а не признак товара.
mining_keywords:
  - "p106"
  - "p104"
  - "p102"
  - "cmp "
  - "30hx"
  - "40hx"
  - "50hx"
  - "70hx"
  - "90hx"

# Ценовые ориентиры. На отбор НЕ влияют (решают вендор и max_price_kzt) —
# определяют только подпись: до excellent_max «🔥 Выгодно», до normal_max
# «✅ Нормальная цена», выше «💸 Выше ориентира».
#
# Основа — медианы по объявлениям Алматы из собственной базы, сборки ПК
# отброшены (там цена за весь комплект). «Выгодно» = 80% медианы. Где
# объявлений меньше пяти, значение выведено из соседних серий: одиночные
# цены там либо приманка, либо ошибка продавца.
#
# Одна запись на серию, без отдельных Ti и Super: медианы и так посчитаны
# по всей серии сразу, так что ориентир для неё усреднённый.
#
# Имя серии собирается правилом из заголовка (detect_series), поэтому список
# псевдонимов больше не нужен: правило само разбирает «RTX3080», «rtx-3080»,
# «ртх 3080» и «3080 Ti». Здесь достаточно имени и двух порогов.
models:
  - name: "GTX 960"
    excellent_max: 24000
    normal_max: 30000
