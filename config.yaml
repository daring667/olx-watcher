  - "nvidia t600"
  - "nvidia t1000"
  - "nvidia t4000"
  - "rtx pro"
  # Именно модели A-серии, а не подстрока "rtx a": она выбрасывала живые
  # игровые карты вроде «RTX asus rog strix 2080 super».
