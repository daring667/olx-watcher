# Майнинговые карты без видеовыходов. Из выборки НЕ исключаются: формально
# это NVIDIA и цена бывает заманчивой. Помечаются флагом — в панели для них
# отдельный экран, в уведомлении строка «⛏ Майнинговая карта».
# Проверяется только заголовок: в описании игровой карты «аналог P106» —
# это сравнение, а не признак товара.
mining_keywords:
  - "p106"
  - "p104"
  - "p102"
  - "cmp "
  - "30hx"
  - "40hx"
  - "50hx"
  - "70hx"
  - "90hx"

# Ориентиры для ПОДПИСИ в уведомлении, на отбор они больше не влияют:
# отбор идёт по вендору и max_price_kzt. До excellent_max — «выгодно»,
# до normal_max — «нормальная цена».
models:
  - name: "RTX 3060 Ti"
    aliases: ["rtx 3060 ti", "rtx3060ti", "3060 ti", "3060ti"]
    excellent_max: 95000
    normal_max: 115000
  - name: "RTX 3060"
    aliases: ["rtx 3060", "rtx3060"]
    excellent_max: 80000
    normal_max: 95000
  - name: "RTX 3070"
    aliases: ["rtx 3070", "rtx3070"]
    excellent_max: 110000
    normal_max: 130000
  - name: "RTX 4060"
    aliases: ["rtx 4060", "rtx4060"]
    excellent_max: 125000
    normal_max: 150000

# Это исключается полностью: не сама дискретная видеокарта.
hard_excluded_keywords:
  - "laptop"
  - "ноутбук"
  - "майнинг ферма"
  - "ферма"
  - "нерабочая"
  - "не включается"
  - "на запчасти"
  - "только чип"
  # Профессиональные / серверные карты, не предназначенные для игрового поиска.
  - "nvidia t400"
  - "nvidia t600"
  - "nvidia t1000"
  - "nvidia t4000"
  - "rtx pro"
  # Именно модели A-серии, а не подстрока "rtx a": она выбрасывала живые
  # игровые карты вроде «RTX asus rog strix 2080 super».
  - "rtx a2000"
  - "rtx a4000"
  - "rtx a4500"
  - "rtx a5000"
  - "rtx a5500"
  - "rtx a6000"
  - "quadro"
  - "tesla"
  - "workstation"
  - "data center"
  - "дата-центр"

# Это не исключается: бот пришлёт объявление с предупреждением ⚠️.
risk_keywords: ["после майнинга", "майнинг", "артефакт", "ремонт", "без проверки", "не тестировал", "неисправ"]

# Если найдено хотя бы одно слово, это комплектующая/аксессуар, а не сама видеокарта.
# Проверяется ТОЛЬКО заголовок: в описании настоящей карты «вентилятор»,
# «кулер» и «радиатор» — это рассказ про систему охлаждения, и по описанию
# так терялось около 60 живых карт.
excluded_any_keywords:
  - "водоблок"
  - "water block"
  - "backplate"
  - "кулер"
  - "кулеры"
  - "вентилятор"
  - "вентиляторы"
  - "термопроклад"
  - "радиатор"
  - "кожух"
  - "шлейф"
  - "запчаст"
  - "держатель"
  - "sli мост"

# Не присылать уже опубликованные объявления после самого первого запуска.
# Поменяйте на true, если хотите получить все подходящие объявления сразу.
notify_existing_on_first_run: false

# Лимит объявлений на одной странице выдачи.
# OLX отдаёт до ~42 карточек на страницу, при 30 остаток молча терялся.
max_candidates_per_search: 60

# Каждый профиль — отдельное направление. Пока активны только видеокарты.
profiles:
  - id: "gpu"
    name: "Видеокарты"
    enabled: true
  - id: "iphone"
    name: "iPhone"
    enabled: false
    search_urls: []
    required_any_keywords: ["iphone"]
    excluded_any_keywords: ["чехол", "стекло", "зарядка", "запчасти"]
  - id: "monitors"
    name: "Мониторы"
    enabled: false
    search_urls: []
    required_any_keywords: ["монитор"]
    excluded_any_keywords: ["кронштейн", "кабель", "матрица", "запчасти"]
