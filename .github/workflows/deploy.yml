name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Import and config check
        run: |
          python -c "import olx_watcher, dashboard"
          python -c "import yaml; yaml.safe_load(open('config.example.yaml', encoding='utf-8'))"

      # Каждый случай в tests/ — реальная ошибка, найденная на боевых данных.
      # Ломались они молча: неверная цена или потерянная карта видны только по
      # базе через сутки, а обход при этом отрабатывает без единой жалобы.
      - name: Run tests
        run: python -m pytest tests/ -q

