name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Import and config check
        run: |
          python -c "import olx_watcher, dashboard"
          python -c "import yaml; yaml.safe_load(open('config.example.yaml', encoding='utf-8'))"

      # Каждый случай в tests/ — реальная ошибка, найденная на боевых данных.
      # Ломались они молча: неверная цена или потерянная карта видны только по
      # базе через сутки, а обход при этом отрабатывает без единой жалобы.
      - name: Run tests
        run: python -m pytest tests/ -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, droid]
    steps:
      - name: Pull latest code
        run: |
          cd /home/droid/olx/olx-watcher
          git fetch origin main

          # `git reset --hard` ниже молча затёр бы правки трекаемых файлов,
          # сделанные прямо на сервере. Сначала прячем их в stash, чтобы
          # ничего не пропало бесследно — вернуть можно `git stash list/pop`.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            STASH_LABEL="ci-autostash-$(date -u +%Y%m%d-%H%M%S)"
            echo "::warning::На сервере есть локальные правки, прячу их как $STASH_LABEL"
            git status --short --untracked-files=no
            git stash push -m "$STASH_LABEL"
          fi

          git reset --hard origin/main

      - name: Install dependencies
        run: |
          cd /home/droid/olx/olx-watcher
          ./venv/bin/pip install -q -r requirements.txt

      - name: Restart services
        run: |
          sudo systemctl restart olx-watcher.service
          sudo systemctl restart olx-dashboard.service

      - name: Wait for startup
        run: sleep 5

      - name: Verify services are active
        run: |
          sudo systemctl is-active olx-watcher.service
          sudo systemctl is-active olx-dashboard.service

      - name: Verify the dashboard actually answers
        run: curl -fsS -o /dev/null http://127.0.0.1:5050/

      - name: Show recent logs on failure
        if: failure()
        run: sudo journalctl -u olx-watcher.service -n 50 --no-pager
